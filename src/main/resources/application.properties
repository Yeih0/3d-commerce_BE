# ===========================================
# APPLICATION
# ===========================================
spring.application.name=ecommerce-3d-backend
server.port=8081

# ===========================================
# DATABASE POSTGRESQL
# ===========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_3d
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================================
# JPA / HIBERNATE
# ===========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# Opzioni: none, validate, update, create, create-drop
# - update: Aggiorna schema automaticamente (dev)
# - validate: Solo controlla schema (prod)
# - create-drop: Ricrea DB ad ogni restart (test)

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===========================================
# LOGGING
# ===========================================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.printstore=DEBUG

# ===========================================
# JWT CONFIGURATION
# ===========================================
jwt.secret=3DPrintStore2024SecretKeyVeryLongAndSecure123456789
jwt.expiration=86400000
# 86400000 ms = 24 ore

# ===========================================
# FILE UPLOAD
# ===========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# ===========================================
# CORS (permettere richieste da Angular)
# ===========================================
cors.allowed-origins=http://localhost:4200,http://localhost:8081

